      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#ring", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power3.out" }, 0);

      tl.fromTo("#rule", { opacity: 0, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.6, ease: "power2.out" }, 0.55);

      tl.to("#ring", { scale: 1.1, duration: 6.8, ease: "none" }, 1.2);
      tl.to("#glow", { opacity: 0, duration: 1.0, ease: "power2.inOut" }, 6.9);
      tl.to("#big", { opacity: 0, duration: 0.8 }, 7);
      tl.to("#count", { opacity: 0, duration: 0.6 }, 7.1);
      tl.to("#small", { opacity: 0, duration: 0.6 }, 7.1);
      window.__timelines["main"] = tl;
