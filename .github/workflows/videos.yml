name: Videos

# فيديوهات القصص (HyperFrames):
#   • validate — على كل PR: يولّد التركيبات ويفحصها (lint + اتساق) بلا متصفح، فهي بوابة رخيصة.
#   • render   — يعرض MP4 فعليًا. يحتاج Chrome، وعدّاءات GitHub تملك إنترنت لتنزيله
#                (بخلاف بيئات sandbox المقيّدة)، فينجح العرض هنا.
#
# كيف يُطلَق render:
#   1) يدويًا عبر workflow_dispatch (بعد دمج هذا الملف إلى main — شرط GitHub).
#   2) أو بدفع commit يحمل [render-videos] في رسالته إلى main أو أي فرع arena/*.
#      هذا الإطلاق الافتراضي صغير (english/draft/limit=3) كتجربة دخان؛ حدّد المدخلات
#      يدويًا للعرض الكامل.

on:
  pull_request:
    paths:
      - 'src/salman/data/**'
      - 'tools/videos/**'
      - 'videos/**'
      - 'public/salman/art/stories/**'
      - 'public/salman/audio/stories/**'
      - 'public/fonts/**'
      - '.github/workflows/videos.yml'
  push:
    branches: [main, 'arena/*']
    paths:
      - 'tools/videos/**'
      - 'videos/**'
      - '.github/workflows/videos.yml'
  workflow_dispatch:
    inputs:
      garden:
        description: 'أي حديقة تُعرض (أو all)'
        required: true
        default: 'english'
        type: choice
        options: [english, math, quran, arabic, all]
      quality:
        description: 'جودة العرض'
        required: true
        default: 'looks'
        type: choice
        options: [draft, looks, delivery]
      format:
        description: 'صيغة الإطار (تُعاد التوليد بها قبل العرض)'
        required: true
        default: 'portrait'
        type: choice
        options: [portrait, landscape, square]
      limit:
        description: 'أقصى عدد فيديوهات (0 = الكل) — للتجربة السريعة'
        required: false
        default: '0'

jobs:
  validate:
    name: Validate compositions (lint + consistency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # HyperFrames يتطلب Node 22+
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build compositions from story data
        run: npm run videos:build -- --format=${{ github.event.inputs.format || 'portrait' }}

      - name: Lint + consistency gate
        run: npm run videos:check

  render:
    name: Render MP4s
    # يدوي دائمًا، أو عند دفع commit يحمل علامة [render-videos]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[render-videos]'))
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # يحسم المدخلات مرة واحدة حسب الأسبقية:
      #   1) وسوم [render-videos key=val …] في رسالة الـ commit (إطلاق الدفع)
      #   2) مدخلات workflow_dispatch
      #   3) افتراضيات تجربة الدخان (english/draft/portrait/limit=3)
      # تُمرَّر رسالة الـ commit عبر env (لا تضمين ${{ }} داخل السكربت) تفاديًا لحقن السكربت.
      - name: Resolve render params
        env:
          HF_MSG: ${{ github.event.head_commit.message }}
          IN_GARDEN: ${{ github.event.inputs.garden }}
          IN_QUALITY: ${{ github.event.inputs.quality }}
          IN_FORMAT: ${{ github.event.inputs.format }}
          IN_LIMIT: ${{ github.event.inputs.limit }}
        run: |
          garden="$IN_GARDEN"; quality="$IN_QUALITY"; format="$IN_FORMAT"; limit="$IN_LIMIT"
          # وسوم رسالة الـ commit تتفوق على المدخلات (لأن إطلاق الدفع لا يملك مدخلات)
          tok=$(printf '%s' "$HF_MSG" | grep -oE '\[render-videos[^]]*\]' | head -1 || true)
          for kv in $tok; do
            case "$kv" in
              garden=*)  garden="${kv#garden=}" ;;
              quality=*) quality="${kv#quality=}";;
              format=*)  format="${kv#format=}" ;;
              limit=*)   limit="${kv#limit=}" ;;
            esac
          done
          # افتراضيات عند الفراغ
          : "${garden:=english}"; : "${quality:=draft}"; : "${format:=portrait}"; : "${limit:=3}"
          # تحقّق مبكر من القيم المسموحة بدل الفشل بعد تنزيل المتصفح
          case "$garden"  in english|math|quran|arabic|all|*,*) ;; *) echo "::error::garden غير صالح: $garden"; exit 1;; esac
          case "$quality" in draft|looks|delivery) ;; *) echo "::error::quality غير صالح: $quality"; exit 1;; esac
          case "$format"  in portrait|landscape|square) ;; *) echo "::error::format غير صالح: $format"; exit 1;; esac
          case "$limit"   in ''|*[!0-9]*) echo "::error::limit يجب أن يكون رقمًا: $limit"; exit 1;; esac
          {
            echo "garden=$garden"; echo "quality=$quality"; echo "format=$format"; echo "limit=$limit"
          } >> "$GITHUB_ENV"
          echo "render params → garden=$garden quality=$quality format=$format limit=$limit"

      - name: Install FFmpeg (runner)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Cache HyperFrames browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hf-browser-${{ runner.os }}

      - name: Ensure Chrome Headless Shell
        run: npx --yes hyperframes@0.8.149 browser ensure

      - name: Install
        run: npm ci

      - name: Build compositions
        run: npm run videos:build -- --format=${{ env.format }}

      - name: Validate before rendering
        run: npm run videos:check

      - name: Render
        run: |
          ARGS="--quality=$quality"
          if [ "$garden" != "all" ]; then ARGS="$ARGS --garden=$garden"; fi
          if [ -n "$limit" ] && [ "$limit" != "0" ]; then ARGS="$ARGS --limit=$limit"; fi
          echo "render-all $ARGS"
          npm run videos:render -- $ARGS

      - name: Upload rendered videos
        uses: actions/upload-artifact@v4
        with:
          name: story-videos-${{ env.garden }}-${{ env.format }}-${{ env.quality }}
          path: videos/renders/
          if-no-files-found: error
          retention-days: 14

      - name: Upload render report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-report-${{ env.garden }}-${{ env.format }}
          path: videos/renders/**/render-report.json
          if-no-files-found: ignore
          retention-days: 14
