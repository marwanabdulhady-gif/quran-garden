<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10b981" />
    <title>حديقة القرآن — رحلة أبطال القرآن</title>
    <meta
      name="description"
      content="رحلة تفاعلية للأطفال للاستماع إلى القرآن والتدرّب على الحفظ، مع التكرار والتفسير والألعاب التشجيعية."
    />
    <meta property="og:title" content="حديقة القرآن — رحلة أبطال القرآن" />
    <meta
      property="og:description"
      content="نتعلّم ونردّد القرآن معًا، آية بخطوة، في حديقة الأبطال."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      /* شاشة البداية — بتظهر قبل ما الباندول يتحمّل (والأسلوب مدمج عشان يشتغل من غير CSS) */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 300;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: linear-gradient(180deg, #ecfdf5, #d1fae5);
        font-family: 'Cairo', 'Segoe UI', Tahoma, sans-serif;
        transition: opacity 0.5s ease;
      }
      #splash .splash-tree {
        font-size: 64px;
        animation: splash-bounce 1.2s ease-in-out infinite;
      }
      #splash .splash-leaves span {
        font-size: 15px;
        animation: splash-bounce 1.2s ease-in-out infinite;
      }
      #splash .splash-leaves span:nth-child(2) { animation-delay: 0.15s; }
      #splash .splash-leaves span:nth-child(3) { animation-delay: 0.3s; }
      #splash .splash-title { font-weight: 900; font-size: 22px; color: #065f46; margin-top: 4px; }
      #splash .splash-sub { color: #047857; font-weight: 700; font-size: 13px; }
      @keyframes splash-bounce {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      body.app-ready #splash { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash * { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="splash-tree">🌳</div>
      <div class="splash-leaves"><span>🍃</span><span>🍃</span><span>🍃</span></div>
      <div class="splash-title">حديقة القرآن</div>
      <div class="splash-sub">جاري تحميل حديقة القرآن...</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
